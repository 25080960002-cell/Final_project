name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Frontend (build, unit, smoke render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:web
      - run: npm run test:smoke

  api:
    name: Backend (sintaks + uji integrasi MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: mapan
          MYSQL_PASSWORD: mapan_ci_pass
          MYSQL_DATABASE: mapan
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: mapan
      DB_PASSWORD: mapan_ci_pass
      DB_NAME: mapan
      TEST_DB_NAME: mapan_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Cek sintaks
        run: |
          for f in $(find src scripts test -name '*.js'); do node --check "$f"; done
      - name: Beri hak database uji
        run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL ON \`mapan_test\`.* TO 'mapan'@'%'; FLUSH PRIVILEGES;"
      - run: npm test
